  function weekKey(d){ return isoLocal(startOfWeekDate(d)); }
  function weekSessionCounts(){
    // Counts DAYS with at least one workout logged, per week — not the number
    // of exercise entries. A day with a 4-exercise routine logged still counts
    // once, the same as a day with a single activity logged.
    var seenDaysByWeek = {};
    var counts = {};
    STATE.workouts.forEach(function(w){
      var wk = weekKey(parseISO(w.date));
      if (!seenDaysByWeek[wk]) seenDaysByWeek[wk] = {};
      if (!seenDaysByWeek[wk][w.date]) {
        seenDaysByWeek[wk][w.date] = true;
        counts[wk] = (counts[wk] || 0) + 1;
      }
    });
    return counts;
  }
  function computeWeekStreak(){
    var counts = weekSessionCounts();
    var cursor = startOfWeekDate(new Date());
    // An in-progress current week that hasn't hit the goal yet doesn't break
    // the streak (it just isn't counted until it does) — same idea as "today
    // not logged yet" not breaking a day streak.
    if ((counts[isoLocal(cursor)] || 0) < WEEK_GOAL) {
      cursor.setDate(cursor.getDate() - 7);
    }
    var streak = 0;
    while ((counts[isoLocal(cursor)] || 0) >= WEEK_GOAL) {
      streak++;
      cursor.setDate(cursor.getDate() - 7);
    }
    return streak;
  }
  function buildWeekCells(weeksCount){
    // Newest first: the current week is cell 0 (leftmost), each older week
    // follows to the right — so an active streak reads as a highlighted run
    // starting at the left edge and extending rightward into the past.
    var counts = weekSessionCounts();
    var currentStart = startOfWeekDate(new Date());
    var cells = [];
    for (var i = 0; i < weeksCount; i++){
      var start = new Date(currentStart); start.setDate(start.getDate() - i*7);
      var key = isoLocal(start);
      cells.push({ key: key, count: counts[key] || 0, isCurrent: i === 0 });
    }
    return cells;
  }
  function formatWeekLabel(iso){
    var d = parseISO(iso);
    return 'Week of ' + d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }
  function workoutsForDate(iso){
    return STATE.workouts.filter(function(w){ return w.date === iso; });
  }
  function monthLabel(year, month){
    return new Date(year, month, 1).toLocaleDateString(undefined, { month:'long', year:'numeric' });
  }
  function buildCalendarGrid(year, month){
    var startWeekday = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var cells = [];
    for (var i=0;i<startWeekday;i++) cells.push(null);
    for (var d=1; d<=daysInMonth; d++) cells.push(new Date(year, month, d));
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }
  function exerciseNames(){
    var seen = {}; var out = [];
    STATE.workouts.forEach(function(w){
      if (w.sets && w.sets.length && !seen[w.name]) { seen[w.name] = true; out.push(w.name); }
    });
    return out;
  }
  function renderExerciseDatalist(){
    var names = EXERCISE_SUGGESTIONS.concat(exerciseNames());
    var seen = {}; var out = [];
    names.forEach(function(n){ if (!seen[n]) { seen[n]=true; out.push(n); } });
    var options = out.map(function(n){ return '<option value="'+escapeHtml(n)+'">'; }).join('');
    return '<datalist id="exercise-options">'+options+'</datalist>';
  }
  function seriesFor(name){
    var entries = STATE.workouts.filter(function(w){ return w.name===name && w.sets && w.sets.length; });
    entries = entries.slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    var hasWeight = entries.some(function(w){ return w.sets.some(function(s){ return s.weight > 0; }); });
    var points = entries.map(function(w){
      if (hasWeight) {
        var maxW = 0;
        w.sets.forEach(function(s){ if (s.reps > 0 && s.weight > maxW) maxW = s.weight; });
        return { date: w.date, value: maxW };
      } else {
        var totalReps = 0;
        w.sets.forEach(function(s){ totalReps += (s.reps||0); });
        return { date: w.date, value: totalReps };
      }
    });
    return { metric: hasWeight ? 'weight' : 'reps', points: points };
  }

  /* ================= persistence (Firebase Auth + Firestore) ================= */
  function setSyncStatus(s){ syncStatus = s; updateSyncBadge(); }

  function isPlaceholderConfig(cfg){
    return !cfg || !cfg.apiKey || cfg.apiKey.indexOf('PASTE_') === 0;
  }

  // A snapshot from another device (or our own write echoing back) always
  // updates STATE right away — it's the source of truth. But if a form is
  // open (editing an entry, mid-routine-log, editing a routine), rebuilding
  // the whole page underneath the user's hands would wipe out whatever
  // they're mid-typing. So: update the data now, defer the re-render until
  // that draft closes (save/cancel already call renderAll() themselves).
  function applyRemoteState(newState){
    STATE = newState;
    if (editingId || routineDraft || routineEditorState) return;
    renderAll();
  }

  function persist(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch(e){}
    if (!currentUser || !db) return;
    // Tied directly to THIS write's own outcome, not just the live listener —
    // Firestore only resolves this promise once the backend has actually
    // acknowledged the write (it stays pending while offline), so this is a
    // reliable "truly synced" signal even if the realtime listener's own
    // connection was frozen or dropped (e.g. the tab was backgrounded) and
    // never separately delivered a confirming snapshot.
    setSyncStatus('syncing');
    db.collection('ascentUsers').doc(currentUser.uid).set(STATE).then(function(){
      setSyncStatus('synced');
    }).catch(function(){
      setSyncStatus('error');
    });
  }

  function handleSignIn(){
    authError = null;
    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(function(err){
      var code = err && err.code;
      if (code === 'auth/popup-blocked' || code === 'auth/cancelled-popup-request' || code === 'auth/operation-not-supported-in-this-environment') {
        auth.signInWithRedirect(provider);
      } else {
        authError = (err && err.message) ? err.message : 'Sign-in failed. Please try again.';
        renderAll();
      }
    });
  }

  function initFirebaseApp(){
    if (isPlaceholderConfig(firebaseConfig)) { firebaseReady = false; renderAll(); return; }
    firebaseReady = true;
    renderAll();
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
      try { db.enablePersistence({ synchronizeTabs: true }).catch(function(){}); } catch(e){}
      auth.getRedirectResult().catch(function(){});
      auth.onAuthStateChanged(function(user){
        authReady = true;
        if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
        if (user) {
          currentUser = user;
          STATE = normalizeState(loadLocalCache());
          renderAll();
          setSyncStatus('checking');
          unsubscribeSnapshot = db.collection('ascentUsers').doc(user.uid).onSnapshot(function(snap){
            var data = (snap && snap.exists) ? snap.data() : null;
            applyRemoteState(normalizeState(data));
            setSyncStatus(snap.metadata.hasPendingWrites ? 'syncing' : (snap.metadata.fromCache ? 'offline' : 'synced'));
          }, function(){
            setSyncStatus('error');
          });
        } else {
          currentUser = null;
          renderAll();
        }
      });
    } catch(e){
      firebaseReady = false;
      authError = 'Could not start Firebase — double check the config values.';
      renderAll();
    }
  }

  /* ================= mutations ================= */
  var LB_PER_KG = 2.20462262;
  function convertWeightValue(value, fromUnit, toUnit){
    if (!value || fromUnit === toUnit) return value;
    var kg = fromUnit === 'kg' ? value : value / LB_PER_KG;
    var out = toUnit === 'kg' ? kg : kg * LB_PER_KG;
    return Math.round(out * 10) / 10;
  }
  function setUnit(newUnit){
    if (newUnit !== 'lb' && newUnit !== 'kg') return;
    if (newUnit === STATE.unit) return;
    var oldUnit = STATE.unit;
    STATE.workouts.forEach(function(w){
      if (w.sets && w.sets.length) {
        w.sets.forEach(function(s){
          if (s.weight > 0) s.weight = convertWeightValue(s.weight, oldUnit, newUnit);
        });
      }
    });
    STATE.unit = newUnit;
    renderAll();
    persist();
  }
  function addWorkout(entry){
    STATE.workouts.push(entry);
    renderAll();
    persist();
  }
  function deleteWorkout(id){
    STATE.workouts = STATE.workouts.filter(function(w){ return w.id !== id; });
    renderAll();
    persist();
  }
  function deleteRoutine(id){
    STATE.routines = STATE.routines.filter(function(r){ return r.id !== id; });
    renderAll();
    persist();
  }

  function buildLineChartSVG(series){
    var W = 640, H = 220, padL = 40, padR = 16, padT = 16, padB = 30;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var points = series.points;
    var n = points.length;
    var values = points.map(function(p){ return p.value; });
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (min === max) { min -= 1; max += 1; }
    var padV = (max-min) * 0.15;
    var yMin = Math.max(0, min - padV), yMax = max + padV;
    if (yMax === yMin) yMax = yMin + 1;

    function xPos(i){ return n<=1 ? padL+innerW/2 : padL + (innerW * i/(n-1)); }
    function yPos(v){ return padT + innerH - ((v-yMin)/(yMax-yMin))*innerH; }

    var pathD = points.map(function(p,i){
      return (i===0?'M':'L') + xPos(i).toFixed(1) + ' ' + yPos(p.value).toFixed(1);
    }).join(' ');
    var baseline = (padT+innerH).toFixed(1);
    var areaD = pathD + ' L ' + xPos(n-1).toFixed(1) + ' ' + baseline + ' L ' + xPos(0).toFixed(1) + ' ' + baseline + ' Z';

    var gridVals = [yMin, (yMin+yMax)/2, yMax];
    var gridLines = gridVals.map(function(v){
      var yv = yPos(v).toFixed(1);
      return '<line x1="'+padL+'" y1="'+yv+'" x2="'+(W-padR)+'" y2="'+yv+'" class="chart-grid" />'
        + '<text x="'+(padL-8)+'" y="'+(parseFloat(yv)+4).toFixed(1)+'" class="chart-tick" text-anchor="end">'+Math.round(v)+'</text>';
    }).join('');

    var dots = points.map(function(p,i){
      var cx = xPos(i).toFixed(1), cy = yPos(p.value).toFixed(1);
      var isLast = i===n-1;
      var unit = series.metric==='weight' ? (' ' + STATE.unit) : ' reps';
      var tip = escapeHtml(formatDateLabel(p.date) + ' · ' + p.value + unit);
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(isLast?6:4)+'" class="chart-dot"><title>'+tip+'</title></circle>';
    }).join('');

    var last = points[n-1];
    var unitLabel = series.metric==='weight' ? (' ' + STATE.unit) : ' reps';
    var endLabel = '<text x="'+(xPos(n-1)+8).toFixed(1)+'" y="'+(yPos(last.value)-10).toFixed(1)+'" class="chart-endlabel" text-anchor="end">'+last.value+unitLabel+'</text>';

    var xTicks = '<text x="'+padL+'" y="'+(H-8)+'" class="chart-tick" text-anchor="start">'+escapeHtml(formatDateLabel(points[0].date))+'</text>'
      + '<text x="'+(W-padR)+'" y="'+(H-8)+'" class="chart-tick" text-anchor="end">'+escapeHtml(formatDateLabel(points[n-1].date))+'</text>';

    return '<svg viewBox="0 0 '+W+' '+H+'" class="chart-svg" role="img" aria-label="Progress chart for '+escapeHtml(series.metric)+'">'
      + gridLines + '<path d="'+areaD+'" class="chart-area" /><path d="'+pathD+'" class="chart-line" />' + dots + endLabel + xTicks
      + '</svg>';
  }

  function renderProgressBody(){
    var names = exerciseNames();
    if (!names.length) {
      return '<p class="empty-note">Log a session with sets to start tracking progress here.</p>';
    }
    if (!selectedExercise || names.indexOf(selectedExercise) === -1) {
      var strengthEntries = STATE.workouts.filter(function(w){ return w.sets && w.sets.length; });
      strengthEntries = strengthEntries.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
      selectedExercise = strengthEntries[0].name;
    }
    var series = seriesFor(selectedExercise);
    var optionsHtml = names.map(function(n){
      return '<option value="'+escapeHtml(n)+'"'+(n===selectedExercise?' selected':'')+'>'+escapeHtml(n)+'</option>';
    }).join('');
    var metricLabel = series.metric === 'weight' ? ('Top set weight per session (' + STATE.unit + ')') : 'Total reps per session';
    var chartHtml;
    if (series.points.length < 2) {
      var p = series.points[0];
      var unit = series.metric==='weight' ? (' ' + STATE.unit) : ' reps';
      chartHtml = '<p class="empty-note">One session logged so far — ' + p.value + unit + ' on ' + escapeHtml(formatDateLabel(p.date)) + '. Log another to see the trend.</p>';
    } else {
      chartHtml = buildLineChartSVG(series);
    }
    return '<div class="progress-controls"><label class="field-label" for="exercise-picker">Exercise</label>'
      + '<select id="exercise-picker" data-action="chart-select">'+optionsHtml+'</select></div>'
      + '<p class="chart-caption">'+escapeHtml(selectedExercise)+' — '+metricLabel+'</p>'
      + chartHtml
      + '<p class="chart-footnote">Full data for every session is in your history below.</p>';
  }

  function renderProgressCard(){
    return '<section class="card" aria-labelledby="progress-heading">'
      + '<h2 id="progress-heading">Progress</h2>'
      + '<div id="progress-body">'+renderProgressBody()+'</div>'
      + '</section>';
  }

  function renderHistoryCard(){
    if (!STATE.workouts.length) {
      return '<section class="card" aria-labelledby="history-heading">'
        + '<h2 id="history-heading">History</h2>'
        + '<p class="empty-note">Nothing logged yet — your first session will show up here.</p>'
        + '</section>';
    }
    var groups = {};
    var order = [];
    var sorted = STATE.workouts.slice().sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    sorted.forEach(function(w){
      if (!groups[w.date]) { groups[w.date] = []; order.push(w.date); }
      groups[w.date].push(w);
    });
    var groupsHtml = order.map(function(date){
      var items = groups[date].map(function(w){
        var isStrength = w.sets && w.sets.length > 0;
        var badgeClass = isStrength ? 'badge-strength' : 'badge-general';
        var badgeText = isStrength ? 'Strength' : 'General';
        var metaBits = [];
        if (isStrength) {
          var setsText = w.sets.map(function(s){
            return s.weight > 0 ? (s.weight + ' ' + STATE.unit + '×' + s.reps) : (s.reps + ' reps');
          }).join(', ');
          metaBits.push(setsText);
        }
        if (w.duration) metaBits.push(w.duration + ' min');
        if (w.notes) metaBits.push(escapeHtml(w.notes));
        var metaHtml = metaBits.length ? '<p class="history-meta">'+metaBits.join(' · ')+'</p>' : '';
        return '<li class="history-item">'
          + '<div class="history-item-main"><span class="badge '+badgeClass+'">'+badgeText+'</span>'
          + '<span class="history-name">'+escapeHtml(w.name)+'</span></div>'
          + metaHtml
          + '<div class="history-actions">'
          + '<button type="button" class="history-action-btn is-edit" data-action="edit-workout" data-id="'+escapeHtml(w.id)+'" aria-label="Edit '+escapeHtml(w.name)+'">Edit</button>'
          + '<button type="button" class="history-action-btn is-delete" data-action="delete-workout" data-id="'+escapeHtml(w.id)+'" aria-label="Delete '+escapeHtml(w.name)+'">Delete</button>'
          + '</div>'
          + '</li>';
      }).join('');
      return '<div class="history-group"><h3 class="history-date">'+escapeHtml(formatDateLabel(date))+'</h3>'
        + '<ul class="history-list">'+items+'</ul></div>';
    }).join('');
    return '<section class="card" aria-labelledby="history-heading">'
      + '<h2 id="history-heading">History</h2>'+groupsHtml+'</section>';
  }

  function renderCalendarBody(){
    var year = calendarView.year, month = calendarView.month;
    var cells = buildCalendarGrid(year, month);
    var todayIso = todayISO();
    var todayNow = new Date();
    var isCurrentMonth = (year === todayNow.getFullYear() && month === todayNow.getMonth());
    var weekdayLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var headerCells = weekdayLabels.map(function(l){ return '<div class="cal-weekday">'+l+'</div>'; }).join('');

    var dayCells = cells.map(function(d){
      if (!d) return '<div class="cal-cell is-empty"></div>';
      var iso = isoLocal(d);
      var entries = workoutsForDate(iso);
      var cls = 'cal-cell';
      if (entries.length) cls += ' is-logged';
      if (iso === todayIso) cls += ' is-today';
      if (iso === calendarSelected) cls += ' is-selected';
      var exerciseWord = entries.length === 1 ? 'exercise' : 'exercises';
      var titleText = entries.length ? ('Workout logged — ' + entries.length + ' ' + exerciseWord) : 'No workout logged';
      return '<button type="button" class="'+cls+'" data-action="select-day" data-date="'+iso+'" title="'+escapeHtml(titleText)+'">'+d.getDate()+'</button>';
    }).join('');

    var detailHtml = '';
    if (calendarSelected) {
      var sel = workoutsForDate(calendarSelected);
      if (sel.length) {
        var rows = sel.map(function(w){
          var isStrength = w.sets && w.sets.length > 0;
          var bits = [];
          if (isStrength) {
            bits.push(w.sets.map(function(s){
              return s.weight > 0 ? (s.weight + ' ' + STATE.unit + '×' + s.reps) : (s.reps + ' reps');
            }).join(', '));
          }
          if (w.duration) bits.push(w.duration + ' min');
          if (w.notes) bits.push(escapeHtml(w.notes));
          return '<li class="cal-detail-item"><span class="history-name">'+escapeHtml(w.name)+'</span>'
            + (bits.length ? ' — ' + bits.join(' · ') : '') + '</li>';
        }).join('');
        detailHtml = '<div class="cal-detail"><p class="field-label">'+escapeHtml(formatDateLabel(calendarSelected))+'</p>'
          + '<ul class="cal-detail-list">'+rows+'</ul></div>';
      } else {
        detailHtml = '<div class="cal-detail"><p class="empty-note">No workout logged on '+escapeHtml(formatDateLabel(calendarSelected))+'.</p></div>';
      }
    }

    return '<div class="calendar-header">'
      + '<button type="button" class="cal-nav-btn" data-action="cal-prev" aria-label="Previous month">‹</button>'
      + '<span class="cal-month-label">'+escapeHtml(monthLabel(year, month))+'</span>'
      + '<button type="button" class="cal-nav-btn" data-action="cal-next" aria-label="Next month">›</button>'
      + '</div>'
      + '<div class="cal-weekdays">'+headerCells+'</div>'
      + '<div class="cal-grid">'+dayCells+'</div>'
      + (isCurrentMonth ? '' : '<button type="button" class="btn-ghost cal-today-btn" data-action="cal-today">Back to today</button>')
      + detailHtml;
  }

  function renderCalendarCard(){
    return '<section class="card" aria-labelledby="calendar-heading">'
      + '<h2 id="calendar-heading">Calendar</h2>'
      + '<div id="calendar-body">'+renderCalendarBody()+'</div>'
      + '</section>';
  }

  function renderFooter(){
    return '<footer class="footer wrap"><p>Ascent keeps every session in your account — open this same page on your phone or computer, signed in with the same Google account, to see it everywhere.</p></footer>';
  }

  function renderConfigNeededScreen(){
    return '<div class="wrap config-screen">'
      + '<span class="wordmark">Ascent</span>'
      + '<h2>One quick setup step</h2>'
      + '<p>This copy of Ascent needs your Firebase project\'s config pasted into the code before it can run. Open <code>index.html</code> in a text editor, find the block near the top marked <code>FIREBASE CONFIG</code>, and replace the placeholder values with the ones from your Firebase project — Project settings → General → "Your apps".</p>'
      + '<p class="hint">See SETUP.md (in the same folder) for the exact click-by-click steps.</p>'
      + '</div>';
  }
  function renderSignInScreen(){
    var errorHtml = authError ? '<p class="auth-error">'+escapeHtml(authError)+'</p>' : '';
    return '<div class="auth-screen">'
      + '<span class="wordmark">Ascent</span>'
      + '<p class="hint">Sign in with Google to load your workouts and keep them synced across every device you sign in on.</p>'
      + '<button type="button" class="btn-primary" data-action="sign-in">Sign in with Google</button>'
      + errorHtml
      + '</div>';
  }
  function renderLoadingScreen(){
    return '<div class="auth-screen"><span class="wordmark">Ascent</span><p class="hint">Loading…</p></div>';
  }
  function renderApp(){
    if (!firebaseReady) return renderConfigNeededScreen();
    if (!authReady) return renderLoadingScreen();
    if (!currentUser) return renderSignInScreen();
    return renderTopbar()
      + renderExerciseDatalist()
      + '<main class="wrap">'
      + renderLogCard()
      + renderRoutinesCard()
      + renderConsistencyCard()
      + renderProgressCard()
      + renderHistoryCard()
      + renderCalendarCard()
      + '</main>'
      + renderFooter();
  }

  function renderAll(){
    document.title = APP_TITLE;
    document.getElementById('app').innerHTML = renderApp();
    updateSyncBadge();
  }

  /* ================= events ================= */
  function onSubmitLog(e){
    e.preventDefault();
    var form = e.target;
    var date = form.querySelector('#f-date').value || todayISO();
    var nameField = form.querySelector('#f-name');
    var name = nameField.value.trim();
    if (!name) { nameField.focus(); return; }
    var setRows = form.querySelectorAll('#sets-list .set-row');
    var sets = [];
    for (var i=0;i<setRows.length;i++){
      var repsInput = setRows[i].querySelector('[data-field="reps"]');
      var weightInput = setRows[i].querySelector('[data-field="weight"]');
      var reps = parseFloat(repsInput.value);
      var weight = parseFloat(weightInput.value);
      reps = isNaN(reps) ? 0 : reps;
      weight = isNaN(weight) ? 0 : weight;
      if (reps > 0 || weight > 0) sets.push({ reps: reps, weight: weight });
    }
    var durationField = form.querySelector('#f-duration');
    var duration = parseFloat(durationField.value);
    var notes = form.querySelector('#f-notes').value.trim();
    var editTargetId = form.getAttribute('data-editing-id');

    if (editTargetId) {
      var idx = -1;
      for (var j=0;j<STATE.workouts.length;j++){ if (STATE.workouts[j].id === editTargetId) { idx = j; break; } }
      if (idx !== -1) {
        STATE.workouts[idx] = {
          id: editTargetId,
          date: date,
          name: name,
          sets: sets,
          duration: isNaN(duration) ? null : duration,
          notes: notes
        };
      }
      editingId = null;
      renderAll();
      persist();
      return;
    }

    var entry = {
      id: makeId(),
      date: date,
      name: name,
      sets: sets,
      duration: isNaN(duration) ? null : duration,
      notes: notes
    };
    addWorkout(entry);
  }

  function startEdit(id){
    clearDraftModes();
    editingId = id;
    renderAll();
    var formEl = document.getElementById('log-form');
    if (formEl && formEl.scrollIntoView) formEl.scrollIntoView({ behavior:'smooth', block:'start' });
    var nameField = document.getElementById('f-name');
    if (nameField) nameField.focus();
  }

  function cancelEdit(){
    editingId = null;
    renderAll();
  }

  function startRoutine(routineId){
    var routine = null;
    for (var i=0;i<STATE.routines.length;i++){ if (STATE.routines[i].id === routineId) { routine = STATE.routines[i]; break; } }
    if (!routine) return;
    clearDraftModes();
    routineDraft = {
      routineId: routineId,
      date: todayISO(),
      exercises: routine.exercises.map(function(ex){
        return {
          name: ex.name,
          include: true,
          sets: (ex.sets && ex.sets.length) ? ex.sets.map(function(s){ return { reps: s.reps, weight: s.weight }; }) : [],
          notes: ''
        };
      })
    };
    renderAll();
    var formEl = document.getElementById('log-form') || document.getElementById('log-heading');
    if (formEl && formEl.scrollIntoView) formEl.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function cancelRoutineLog(){
    routineDraft = null;
    renderAll();
  }

  function onSaveRoutineLog(){
    var dateField = document.getElementById('rd-date');
    var date = (dateField && dateField.value) || todayISO();
    var blocks = document.querySelectorAll('#routine-draft-exercises .routine-exercise-block');
    var newEntries = [];
    for (var i=0;i<blocks.length;i++){
      var checkbox = blocks[i].querySelector('.routine-include-checkbox');
      if (checkbox && !checkbox.checked) continue;
      var exIndex = parseInt(blocks[i].getAttribute('data-ex-index'), 10);
      var exDraft = routineDraft.exercises[exIndex];
      var exName = exDraft ? exDraft.name : '';
      if (!exName) continue;
      var setRows = blocks[i].querySelectorAll('.set-row');
      var sets = [];
      for (var j=0;j<setRows.length;j++){
        var repsInput = setRows[j].querySelector('[data-field="reps"]');
        var weightInput = setRows[j].querySelector('[data-field="weight"]');
        var reps = parseFloat(repsInput.value);
        var weight = parseFloat(weightInput.value);
        reps = isNaN(reps) ? 0 : reps;
        weight = isNaN(weight) ? 0 : weight;
        if (reps > 0 || weight > 0) sets.push({ reps: reps, weight: weight });
      }
      var noteInput = blocks[i].querySelector('.routine-exercise-note');
      var exNotes = noteInput ? noteInput.value.trim() : '';
      newEntries.push({ id: makeId(), date: date, name: exName, sets: sets, duration: null, notes: exNotes });
    }
    if (!newEntries.length) { window.alert('Include at least one exercise to log.'); return; }
    routineDraft = null;
    newEntries.forEach(function(entry){ STATE.workouts.push(entry); });
    renderAll();
    persist();
  }

  function startNewRoutine(){
    clearDraftModes();
    routineEditorState = { id: null };
    renderAll();
    var nameField = document.getElementById('routine-name');
    if (nameField) nameField.focus();
  }

  function startEditRoutine(id){
    clearDraftModes();
    routineEditorState = { id: id };
    renderAll();
    var nameField = document.getElementById('routine-name');
    if (nameField) nameField.focus();
  }

  function cancelRoutineEdit(){
    routineEditorState = null;
    renderAll();
  }

  function onSaveRoutine(){
    var nameField = document.getElementById('routine-name');
    var name = nameField.value.trim();
    if (!name) { nameField.focus(); return; }
    var blocks = document.querySelectorAll('#routine-exercises-list .routine-exercise-block');
    var exercises = [];
    for (var i=0;i<blocks.length;i++){
      var exNameInput = blocks[i].querySelector('.routine-exercise-name');
      var exName = exNameInput.value.trim();
      if (!exName) continue;
      var setRows = blocks[i].querySelectorAll('.set-row');
      var sets = [];
      for (var j=0;j<setRows.length;j++){
        var repsInput = setRows[j].querySelector('[data-field="reps"]');
        var weightInput = setRows[j].querySelector('[data-field="weight"]');
        var reps = parseFloat(repsInput.value);
        var weight = parseFloat(weightInput.value);
        reps = isNaN(reps) ? 0 : reps;
        weight = isNaN(weight) ? 0 : weight;
        if (reps > 0 || weight > 0) sets.push({ reps: reps, weight: weight });
      }
      exercises.push({ name: exName, sets: sets });
    }
    if (!exercises.length) { window.alert('Add at least one exercise with a name.'); return; }
    if (routineEditorState.id) {
      var idx = -1;
      for (var k=0;k<STATE.routines.length;k++){ if (STATE.routines[k].id === routineEditorState.id) { idx = k; break; } }
      if (idx !== -1) STATE.routines[idx] = { id: routineEditorState.id, name: name, exercises: exercises };
    } else {
      STATE.routines.push({ id: makeId(), name: name, exercises: exercises });
    }
    routineEditorState = null;
    renderAll();
    persist();
  }

  function onAppClick(e){
    var btn = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    if (action === 'add-set') {
      document.getElementById('sets-list').insertAdjacentHTML('beforeend', renderSetRow());
    } else if (action === 'remove-set') {
      var row = btn.closest('.set-row');
      if (row) row.parentNode.removeChild(row);
    } else if (action === 'delete-workout') {
      var id = btn.getAttribute('data-id');
      if (window.confirm('Delete this entry?')) deleteWorkout(id);
    } else if (action === 'edit-workout') {
      startEdit(btn.getAttribute('data-id'));
    } else if (action === 'cancel-edit') {
      cancelEdit();
    } else if (action === 'set-unit') {
      setUnit(btn.getAttribute('data-unit'));
    } else if (action === 'cal-prev') {
      calendarView.month -= 1;
      if (calendarView.month < 0) { calendarView.month = 11; calendarView.year -= 1; }
      document.getElementById('calendar-body').innerHTML = renderCalendarBody();
    } else if (action === 'cal-next') {
      calendarView.month += 1;
      if (calendarView.month > 11) { calendarView.month = 0; calendarView.year += 1; }
      document.getElementById('calendar-body').innerHTML = renderCalendarBody();
    } else if (action === 'cal-today') {
      var t = new Date();
      calendarView.year = t.getFullYear();
      calendarView.month = t.getMonth();
      document.getElementById('calendar-body').innerHTML = renderCalendarBody();
    } else if (action === 'select-day') {
      var dsel = btn.getAttribute('data-date');
      calendarSelected = (calendarSelected === dsel) ? null : dsel;
      document.getElementById('calendar-body').innerHTML = renderCalendarBody();
    } else if (action === 'new-routine') {
      startNewRoutine();
    } else if (action === 'edit-routine') {
      startEditRoutine(btn.getAttribute('data-id'));
    } else if (action === 'delete-routine') {
      var routineIdToDelete = btn.getAttribute('data-id');
      if (window.confirm('Delete this routine? Logged sessions from it are not affected.')) deleteRoutine(routineIdToDelete);
    } else if (action === 'cancel-routine-edit') {
      cancelRoutineEdit();
    } else if (action === 'save-routine') {
      onSaveRoutine();
    } else if (action === 'routine-add-exercise') {
      document.getElementById('routine-exercises-list').insertAdjacentHTML('beforeend', renderRoutineExerciseBlock());
    } else if (action === 'routine-remove-exercise') {
      var exBlock = btn.closest('.routine-exercise-block');
      if (exBlock) exBlock.parentNode.removeChild(exBlock);
    } else if (action === 'routine-add-set') {
      var hostBlock = btn.closest('.routine-exercise-block');
      if (hostBlock) hostBlock.querySelector('.routine-sets-list').insertAdjacentHTML('beforeend', renderSetRow());
    } else if (action === 'start-routine') {
      startRoutine(btn.getAttribute('data-id'));
    } else if (action === 'cancel-routine-log') {
      cancelRoutineLog();
    } else if (action === 'save-routine-log') {
      onSaveRoutineLog();
    } else if (action === 'sign-in') {
      handleSignIn();
    } else if (action === 'sign-out') {
      if (auth) auth.signOut();
    }
  }
  function onAppChange(e){
    if (e.target && e.target.id === 'exercise-picker') {
      selectedExercise = e.target.value;
      document.getElementById('progress-body').innerHTML = renderProgressBody();
    }
  }
  function onAppSubmit(e){
    if (e.target && e.target.id === 'log-form') onSubmitLog(e);
  }

  function wireEvents(){
    var app = document.getElementById('app');
    app.addEventListener('click', onAppClick);
    app.addEventListener('change', onAppChange);
    app.addEventListener('submit', onAppSubmit);
  }

  /* ================= init ================= */
  document.head.insertAdjacentHTML('beforeend', '<style>' + CSS_TEXT + '</style>');
  document.title = APP_TITLE;
  wireEvents();
  initFirebaseApp();
})();
</script>
</body>
</html>
